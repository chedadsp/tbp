<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-Body Problem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    min-width: 220px;
  }
  #controls h1 {
    font-size: 14px;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ctrl-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .ctrl-row label { color: #888; }
  .ctrl-row input[type=range] {
    width: 100px;
    accent-color: #6af;
  }
  button {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-top: 6px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
  }
  #energy {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
  <h1>Three-Body Problem</h1>
  <div class="ctrl-row">
    <label>Speed</label>
    <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
  </div>
  <div class="ctrl-row">
    <label>Trail Length</label>
    <input type="range" id="trail" min="0" max="800" step="10" value="400">
  </div>
  <div class="ctrl-row">
    <label>Gravity (G)</label>
    <input type="range" id="gravity" min="0.1" max="10" step="0.1" value="1">
  </div>
  <div>
    <button id="btnReset">Reset</button>
    <button id="btnPause">Pause</button>
    <button id="btnPreset">Next Preset</button>
  </div>
</div>

<div id="info">Click & drag a body to reposition it</div>
<div id="energy"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const COLORS = [
  { r: 100, g: 180, b: 255 },  // blue
  { r: 255, g: 120, b: 80 },   // orange-red
  { r: 120, g: 255, b: 160 },  // green
];
const GLOW_COLORS = ['#6ab4ff', '#ff7850', '#78ffa0'];
const SOFTENING = 20;
const DT_BASE = 0.004;

// --- Presets ---
const PRESETS = [
  { // Figure-8
    name: 'Figure-8',
    bodies: [
      { x: -0.97000436, y:  0.24308753, vx:  0.4662036850, vy:  0.4323657300, m: 1 },
      { x:  0.97000436, y: -0.24308753, vx:  0.4662036850, vy:  0.4323657300, m: 1 },
      { x:  0,          y:  0,          vx: -0.9324073700, vy: -0.8647314600, m: 1 },
    ],
    scale: 250,
  },
  { // Lagrange equilateral
    name: 'Lagrange Triangle',
    bodies: [
      { x:  0,    y: -1.2, vx:  0.5,  vy:  0.0, m: 1 },
      { x:  1.04, y:  0.6, vx: -0.25, vy:  0.433, m: 1 },
      { x: -1.04, y:  0.6, vx: -0.25, vy: -0.433, m: 1 },
    ],
    scale: 200,
  },
  { // Butterfly
    name: 'Butterfly',
    bodies: [
      { x: -1, y:  0, vx:  0.30689, vy:  0.12551, m: 1 },
      { x:  1, y:  0, vx:  0.30689, vy:  0.12551, m: 1 },
      { x:  0, y:  0, vx: -0.61378, vy: -0.25102, m: 1 },
    ],
    scale: 220,
  },
  { // Unequal masses — chaotic
    name: 'Chaotic (unequal)',
    bodies: [
      { x: -1.2, y:  0,   vx:  0.0, vy:  0.45, m: 1.5 },
      { x:  0.8, y:  0.6, vx: -0.3, vy: -0.2, m: 1.0 },
      { x:  0.4, y: -0.8, vx:  0.3, vy: -0.25, m: 0.8 },
    ],
    scale: 200,
  },
  { // Broucke orbit
    name: 'Broucke',
    bodies: [
      { x: -0.9892620043, y: 0, vx: 0, vy: -1.2246444985, m: 1 },
      { x:  2.2096177241, y: 0, vx: 0, vy: -0.5765405586, m: 1 },
      { x: -1.2203557197, y: 0, vx: 0, vy:  1.8011850571, m: 1 },
    ],
    scale: 140,
  },
];

let presetIdx = 0;
let bodies = [];
let trails = [];
let paused = false;
let dragging = -1;
let G_MULT = 1;

function loadPreset(idx) {
  const p = PRESETS[idx % PRESETS.length];
  bodies = p.bodies.map(b => ({
    x: b.x * p.scale,
    y: b.y * p.scale,
    vx: b.vx * p.scale,
    vy: b.vy * p.scale,
    m: b.m,
  }));
  trails = [[], [], []];
  currentLabel = p.name;
}

function randomize() {
  const spread = 200;
  const vSpread = 120;
  // Random masses between 0.4 and 2.5
  const masses = [
    0.4 + Math.random() * 2.1,
    0.4 + Math.random() * 2.1,
    0.4 + Math.random() * 2.1,
  ];
  bodies = [];
  for (let i = 0; i < 3; i++) {
    bodies.push({
      x: (Math.random() - 0.5) * spread * 2,
      y: (Math.random() - 0.5) * spread * 2,
      vx: (Math.random() - 0.5) * vSpread * 2,
      vy: (Math.random() - 0.5) * vSpread * 2,
      m: masses[i],
    });
  }
  // Zero out net momentum so system doesn't drift off-screen
  let px = 0, py = 0, mTotal = 0;
  for (const b of bodies) { px += b.vx * b.m; py += b.vy * b.m; mTotal += b.m; }
  for (const b of bodies) { b.vx -= px / mTotal; b.vy -= py / mTotal; }
  // Center of mass at origin
  let cx = 0, cy = 0;
  for (const b of bodies) { cx += b.x * b.m; cy += b.y * b.m; }
  for (const b of bodies) { b.x -= cx / mTotal; b.y -= cy / mTotal; }
  trails = [[], [], []];
  currentLabel = `Random (m: ${masses.map(m => m.toFixed(1)).join(', ')})`;
}

let currentLabel = '';
loadPreset(0);

// --- Physics (Velocity Verlet) ---
function computeAccelerations(bods) {
  const G = 800 * G_MULT;
  const acc = bods.map(() => ({ ax: 0, ay: 0 }));
  for (let i = 0; i < bods.length; i++) {
    for (let j = i + 1; j < bods.length; j++) {
      const dx = bods[j].x - bods[i].x;
      const dy = bods[j].y - bods[i].y;
      const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const F = G / (distSq * dist);
      acc[i].ax += F * dx * bods[j].m;
      acc[i].ay += F * dy * bods[j].m;
      acc[j].ax -= F * dx * bods[i].m;
      acc[j].ay -= F * dy * bods[i].m;
    }
  }
  return acc;
}

function step(dt) {
  const acc = computeAccelerations(bodies);
  // Half-step velocity + full-step position
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc[i].ax * dt * 0.5;
    bodies[i].vy += acc[i].ay * dt * 0.5;
    bodies[i].x += bodies[i].vx * dt;
    bodies[i].y += bodies[i].vy * dt;
  }
  // New accelerations
  const acc2 = computeAccelerations(bodies);
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc2[i].ax * dt * 0.5;
    bodies[i].vy += acc2[i].ay * dt * 0.5;
  }
}

function totalEnergy() {
  const G = 800 * G_MULT;
  let KE = 0, PE = 0;
  for (let i = 0; i < bodies.length; i++) {
    KE += 0.5 * bodies[i].m * (bodies[i].vx ** 2 + bodies[i].vy ** 2);
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy + SOFTENING * SOFTENING);
      PE -= G * bodies[i].m * bodies[j].m / dist;
    }
  }
  return { KE, PE, total: KE + PE };
}

// --- Rendering ---
function drawTrail(trail, color, maxLen) {
  if (trail.length < 2) return;
  const start = Math.max(0, trail.length - maxLen);
  for (let i = start + 1; i < trail.length; i++) {
    const alpha = (i - start) / (trail.length - start);
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x + W / 2, trail[i - 1].y + H / 2);
    ctx.lineTo(trail[i].x + W / 2, trail[i].y + H / 2);
    ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${alpha * 0.6})`;
    ctx.lineWidth = 1 + alpha * 1.5;
    ctx.stroke();
  }
}

function drawBody(b, idx) {
  const cx = b.x + W / 2;
  const cy = b.y + H / 2;
  const radius = 4 + b.m * 4;

  // Outer glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 8);
  grad.addColorStop(0, GLOW_COLORS[idx] + '44');
  grad.addColorStop(0.4, GLOW_COLORS[idx] + '11');
  grad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 8, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Inner glow
  const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.5);
  grad2.addColorStop(0, '#fff');
  grad2.addColorStop(0.3, GLOW_COLORS[idx]);
  grad2.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 2.5, 0, Math.PI * 2);
  ctx.fillStyle = grad2;
  ctx.fill();

  // Core
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function drawGravityLines() {
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const alpha = Math.max(0.02, Math.min(0.12, 200 / dist));
      ctx.beginPath();
      ctx.moveTo(bodies[i].x + W / 2, bodies[i].y + H / 2);
      ctx.lineTo(bodies[j].x + W / 2, bodies[j].y + H / 2);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
}

// Draw individual force vectors from each other body
function drawForceVectors() {
  const G = 800 * G_MULT;
  const ARROW_SCALE = 0.0004; // scale force magnitude to pixel length
  const MAX_ARROW = 120;

  for (let i = 0; i < bodies.length; i++) {
    const cx = bodies[i].x + W / 2;
    const cy = bodies[i].y + H / 2;

    for (let j = 0; j < bodies.length; j++) {
      if (i === j) continue;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const Fmag = G * bodies[i].m * bodies[j].m / distSq;

      // Direction unit vector
      const ux = dx / dist;
      const uy = dy / dist;

      // Arrow length (clamped)
      const len = Math.min(Fmag * ARROW_SCALE, MAX_ARROW);
      const ex = cx + ux * len;
      const ey = cy + uy * len;

      // Arrow color matches the body that is *attracting* (source j)
      const c = COLORS[j];
      const alpha = 0.7;

      // Shaft
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Arrowhead
      const headLen = Math.min(10, len * 0.35);
      const angle = Math.atan2(ey - cy, ex - cx);
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - headLen * Math.cos(angle - 0.4), ey - headLen * Math.sin(angle - 0.4));
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - headLen * Math.cos(angle + 0.4), ey - headLen * Math.sin(angle + 0.4));
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Force magnitude label
      ctx.font = '9px Courier New';
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.6)`;
      const lx = cx + ux * len * 0.5 + uy * 10;
      const ly = cy + uy * len * 0.5 - ux * 10;
      ctx.fillText(`F=${Fmag.toFixed(0)}`, lx, ly);
    }
  }
}

// --- Stars background ---
const stars = Array.from({ length: 300 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.2 + 0.2,
  a: Math.random() * 0.5 + 0.1,
}));

function drawStars() {
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  }
}

// --- Main loop ---
const speedSlider = document.getElementById('speed');
const trailSlider = document.getElementById('trail');
const gravitySlider = document.getElementById('gravity');
const energyDiv = document.getElementById('energy');

let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);

  const speedMult = parseFloat(speedSlider.value);
  const trailLen = parseInt(trailSlider.value);
  G_MULT = parseFloat(gravitySlider.value);

  // Background
  ctx.fillStyle = 'rgba(0, 0, 5, 0.15)';
  ctx.fillRect(0, 0, W, H);
  if (frameCount % 60 === 0) {
    ctx.fillStyle = '#000005';
    ctx.fillRect(0, 0, W, H);
    drawStars();
  }

  if (!paused && dragging === -1) {
    const substeps = Math.ceil(speedMult * 4);
    const dt = DT_BASE * speedMult / substeps;
    for (let s = 0; s < substeps; s++) {
      step(dt);
    }
    for (let i = 0; i < bodies.length; i++) {
      trails[i].push({ x: bodies[i].x, y: bodies[i].y });
      if (trails[i].length > 2000) trails[i].splice(0, trails[i].length - 2000);
    }
  }

  // Draw
  drawGravityLines();
  for (let i = 0; i < bodies.length; i++) drawTrail(trails[i], COLORS[i], trailLen);
  for (let i = 0; i < bodies.length; i++) drawBody(bodies[i], i);
  drawForceVectors();

  // Mass labels next to each body
  for (let i = 0; i < bodies.length; i++) {
    const bx = bodies[i].x + W / 2;
    const by = bodies[i].y + H / 2;
    const radius = 4 + bodies[i].m * 4;
    ctx.font = '10px Courier New';
    ctx.fillStyle = GLOW_COLORS[i];
    ctx.fillText(`m=${bodies[i].m.toFixed(1)}`, bx + radius + 6, by - radius - 4);
  }

  // Energy readout
  if (frameCount % 30 === 0) {
    const e = totalEnergy();
    energyDiv.innerHTML =
      `E = ${e.total.toFixed(1)}<br>` +
      `KE = ${e.KE.toFixed(1)}<br>` +
      `PE = ${e.PE.toFixed(1)}<br>` +
      `<br>${currentLabel}`;
  }

  frameCount++;
}

animate();

// --- Controls ---
document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Play' : 'Pause';
});

document.getElementById('btnReset').addEventListener('click', () => {
  randomize();
  ctx.clearRect(0, 0, W, H);
});

document.getElementById('btnPreset').addEventListener('click', () => {
  presetIdx++;
  loadPreset(presetIdx);
  ctx.clearRect(0, 0, W, H);
});

// --- Drag interaction ---
canvas.addEventListener('mousedown', (e) => {
  const mx = e.clientX - W / 2;
  const my = e.clientY - H / 2;
  for (let i = 0; i < bodies.length; i++) {
    const dx = bodies[i].x - mx;
    const dy = bodies[i].y - my;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      dragging = i;
      break;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (dragging >= 0) {
    bodies[dragging].x = e.clientX - W / 2;
    bodies[dragging].y = e.clientY - H / 2;
    bodies[dragging].vx = 0;
    bodies[dragging].vy = 0;
    trails[dragging] = [];
  }
});

canvas.addEventListener('mouseup', () => { dragging = -1; });
canvas.addEventListener('mouseleave', () => { dragging = -1; });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPause').click(); }
  if (e.code === 'KeyR') document.getElementById('btnReset').click();
  if (e.code === 'KeyN') document.getElementById('btnPreset').click();
});
</script>
</body>
</html>
