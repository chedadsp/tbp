<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-Body Problem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    min-width: 220px;
  }
  #controls h1 {
    font-size: 14px;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ctrl-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .ctrl-row label { color: #888; }
  .ctrl-row input[type=range] {
    width: 90px;
    accent-color: #6af;
  }
  .ctrl-row .val {
    color: #6af;
    min-width: 36px;
    text-align: right;
    font-size: 11px;
  }
  button {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-top: 6px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
  }
  #energy {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
  <h1>Three-Body Problem</h1>
  <div class="ctrl-row">
    <label>Speed</label>
    <input type="range" id="speed" min="0.1" max="50" step="0.1" value="25">
    <span class="val" id="speedVal">25.0x</span>
  </div>
  <div class="ctrl-row">
    <label>Gravity</label>
    <input type="range" id="gravity" min="0.1" max="10" step="0.1" value="1.0">
    <span class="val" id="gravityVal">1.0</span>
  </div>
  <div>
    <button id="btnRandomize">Randomize</button>
    <button id="btnPause">Pause</button>
  </div>
</div>

<div id="info">Click & drag a body to reposition it</div>
<div id="energy"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const COLORS = [
  { r: 100, g: 180, b: 255 },  // blue
  { r: 255, g: 120, b: 80 },   // orange-red
  { r: 120, g: 255, b: 160 },  // green
];
const GLOW_COLORS = ['#6ab4ff', '#ff7850', '#78ffa0'];
const SOFTENING = 8;
const DT_BASE = 0.05;

let bodies = [];
let trails = [];
let paused = false;
let dragging = -1;
let G_MULT = 1;
let currentLabel = '';
let initialState = null;

function saveInitialState() {
  initialState = bodies.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, m: b.m }));
}

function restoreInitialState() {
  if (!initialState) return;
  bodies = initialState.map(b => ({ ...b }));
  trails = [[], [], []];
}

function randomize() {
  const G = 800;
  const spread = 200;
  // Random masses between 0.5 and 3.0
  const masses = [
    0.5 + Math.random() * 2.5,
    0.5 + Math.random() * 2.5,
    0.5 + Math.random() * 2.5,
  ];
  const mTotal = masses[0] + masses[1] + masses[2];

  // Place bodies at random positions, ensure minimum separation
  bodies = [];
  for (let i = 0; i < 3; i++) {
    let x, y, tooClose;
    do {
      x = (Math.random() - 0.5) * spread * 2;
      y = (Math.random() - 0.5) * spread * 2;
      tooClose = false;
      for (let k = 0; k < bodies.length; k++) {
        const d = Math.sqrt((x - bodies[k].x) ** 2 + (y - bodies[k].y) ** 2);
        if (d < 60) { tooClose = true; break; }
      }
    } while (tooClose);
    bodies.push({ x, y, vx: 0, vy: 0, m: masses[i] });
  }

  // Center of mass at origin
  let cmx = 0, cmy = 0;
  for (const b of bodies) { cmx += b.x * b.m; cmy += b.y * b.m; }
  for (const b of bodies) { b.x -= cmx / mTotal; b.y -= cmy / mTotal; }

  // Give each body an orbital-scale velocity (tangential to center of mass)
  // v_orbital ~ sqrt(G * M_other / r) — ensures gravitationally bound curved orbits
  for (let i = 0; i < 3; i++) {
    const r = Math.sqrt(bodies[i].x ** 2 + bodies[i].y ** 2) || 1;
    const otherMass = mTotal - bodies[i].m;
    const vOrbit = Math.sqrt(G * otherMass / r);
    // Tangential direction (perpendicular to radius) + radial perturbation
    const angle = Math.atan2(bodies[i].y, bodies[i].x) + Math.PI / 2;
    // Guarantee non-zero: minimum 40% of orbital speed
    const speed = vOrbit * (0.4 + Math.random() * 0.6);
    const sign = Math.random() < 0.5 ? -1 : 1;
    bodies[i].vx = sign * Math.cos(angle) * speed + (Math.random() - 0.5) * vOrbit * 0.3;
    bodies[i].vy = sign * Math.sin(angle) * speed + (Math.random() - 0.5) * vOrbit * 0.3;
  }

  // Ensure every body has non-zero velocity (safety net)
  for (const b of bodies) {
    const v = Math.sqrt(b.vx ** 2 + b.vy ** 2);
    if (v < 1) {
      const a = Math.random() * Math.PI * 2;
      b.vx = Math.cos(a) * 5;
      b.vy = Math.sin(a) * 5;
    }
  }

  // Zero net momentum so system stays centered
  let px = 0, py = 0;
  for (const b of bodies) { px += b.vx * b.m; py += b.vy * b.m; }
  for (const b of bodies) { b.vx -= px / mTotal; b.vy -= py / mTotal; }

  trails = [[], [], []];
  currentLabel = `m: ${masses.map(m => m.toFixed(1)).join(', ')}`;
  saveInitialState();
}

randomize();

// --- Physics (Velocity Verlet) ---
function computeAccelerations(bods) {
  const G = 800 * G_MULT;
  const acc = bods.map(() => ({ ax: 0, ay: 0 }));
  for (let i = 0; i < bods.length; i++) {
    for (let j = i + 1; j < bods.length; j++) {
      const dx = bods[j].x - bods[i].x;
      const dy = bods[j].y - bods[i].y;
      const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const F = G / (distSq * dist);
      acc[i].ax += F * dx * bods[j].m;
      acc[i].ay += F * dy * bods[j].m;
      acc[j].ax -= F * dx * bods[i].m;
      acc[j].ay -= F * dy * bods[i].m;
    }
  }
  return acc;
}

function step(dt) {
  const acc = computeAccelerations(bodies);
  // Half-step velocity + full-step position
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc[i].ax * dt * 0.5;
    bodies[i].vy += acc[i].ay * dt * 0.5;
    bodies[i].x += bodies[i].vx * dt;
    bodies[i].y += bodies[i].vy * dt;
  }
  // New accelerations
  const acc2 = computeAccelerations(bodies);
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc2[i].ax * dt * 0.5;
    bodies[i].vy += acc2[i].ay * dt * 0.5;
  }
}

function totalEnergy() {
  const G = 800 * G_MULT;
  let KE = 0, PE = 0;
  for (let i = 0; i < bodies.length; i++) {
    KE += 0.5 * bodies[i].m * (bodies[i].vx ** 2 + bodies[i].vy ** 2);
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy + SOFTENING * SOFTENING);
      PE -= G * bodies[i].m * bodies[j].m / dist;
    }
  }
  return { KE, PE, total: KE + PE };
}

// --- Rendering ---
function drawTrail(trail, color, maxLen) {
  if (trail.length < 2) return;
  const start = Math.max(0, trail.length - maxLen);
  for (let i = start + 1; i < trail.length; i++) {
    const alpha = (i - start) / (trail.length - start);
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x + W / 2, trail[i - 1].y + H / 2);
    ctx.lineTo(trail[i].x + W / 2, trail[i].y + H / 2);
    ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${alpha * 0.6})`;
    ctx.lineWidth = 1 + alpha * 1.5;
    ctx.stroke();
  }
}

function drawBody(b, idx) {
  const cx = b.x + W / 2;
  const cy = b.y + H / 2;
  const radius = 4 + b.m * 4;

  // Outer glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 8);
  grad.addColorStop(0, GLOW_COLORS[idx] + '44');
  grad.addColorStop(0.4, GLOW_COLORS[idx] + '11');
  grad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 8, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Inner glow
  const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.5);
  grad2.addColorStop(0, '#fff');
  grad2.addColorStop(0.3, GLOW_COLORS[idx]);
  grad2.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 2.5, 0, Math.PI * 2);
  ctx.fillStyle = grad2;
  ctx.fill();

  // Core
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function drawGravityLines() {
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const alpha = Math.max(0.02, Math.min(0.12, 200 / dist));
      ctx.beginPath();
      ctx.moveTo(bodies[i].x + W / 2, bodies[i].y + H / 2);
      ctx.lineTo(bodies[j].x + W / 2, bodies[j].y + H / 2);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
}

function drawArrow(x1, y1, x2, y2, color, alpha, width) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${alpha})`;
  ctx.lineWidth = width;
  ctx.stroke();
  // Arrowhead
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 4) return;
  const headLen = Math.min(10, len * 0.35);
  const angle = Math.atan2(dy, dx);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.45), y2 - headLen * Math.sin(angle - 0.45));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.45), y2 - headLen * Math.sin(angle + 0.45));
  ctx.closePath();
  ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${alpha})`;
  ctx.fill();
}

// Draw per-body: velocity vector, individual force from each other body, net acceleration
function drawForceVectors() {
  const G = 800 * G_MULT;
  const F_SCALE = 0.08;  // force to pixels
  const A_SCALE = 12;    // acceleration to pixels
  const V_SCALE = 0.6;   // velocity to pixels
  const MAX_LEN = 140;

  for (let i = 0; i < bodies.length; i++) {
    const cx = bodies[i].x + W / 2;
    const cy = bodies[i].y + H / 2;
    const radius = 4 + bodies[i].m * 4;

    // --- Velocity vector (white, dashed-style) ---
    const vLen = Math.min(Math.sqrt(bodies[i].vx ** 2 + bodies[i].vy ** 2) * V_SCALE, MAX_LEN);
    if (vLen > 2) {
      const vNorm = Math.sqrt(bodies[i].vx ** 2 + bodies[i].vy ** 2) || 1;
      const vex = cx + (bodies[i].vx / vNorm) * vLen;
      const vey = cy + (bodies[i].vy / vNorm) * vLen;
      drawArrow(cx, cy, vex, vey, { r: 255, g: 255, b: 255 }, 0.35, 1.5);
      ctx.font = '9px Courier New';
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('v', vex + 4, vey - 4);
    }

    // --- Individual gravitational force from each other body ---
    let netAx = 0, netAy = 0;

    for (let j = 0; j < bodies.length; j++) {
      if (i === j) continue;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);

      // Force vector: F = G * mi * mj / r^2, direction toward j
      const Fmag = G * bodies[i].m * bodies[j].m / distSq;
      const ux = dx / dist;
      const uy = dy / dist;

      // Acceleration on body i from body j: a = F / mi = G * mj / r^2
      const ax = G * bodies[j].m / distSq * ux;
      const ay = G * bodies[j].m / distSq * uy;
      netAx += ax;
      netAy += ay;

      // Draw force arrow (colored by attracting body j)
      const fLen = Math.min(Fmag * F_SCALE, MAX_LEN);
      if (fLen > 2) {
        const fex = cx + ux * fLen;
        const fey = cy + uy * fLen;
        drawArrow(cx, cy, fex, fey, COLORS[j], 0.65, 2);

        // Label
        ctx.font = '9px Courier New';
        ctx.fillStyle = `rgba(${COLORS[j].r},${COLORS[j].g},${COLORS[j].b},0.55)`;
        const lx = cx + ux * fLen * 0.55 + uy * 12;
        const ly = cy + uy * fLen * 0.55 - ux * 12;
        ctx.fillText(`F=${Fmag.toFixed(1)}`, lx, ly);
      }
    }

    // --- Net acceleration vector (yellow) ---
    const aMag = Math.sqrt(netAx ** 2 + netAy ** 2);
    const aLen = Math.min(aMag * A_SCALE, MAX_LEN);
    if (aLen > 3) {
      const aex = cx + (netAx / aMag) * aLen;
      const aey = cy + (netAy / aMag) * aLen;
      drawArrow(cx, cy, aex, aey, { r: 255, g: 230, b: 50 }, 0.85, 2.5);
      ctx.font = 'bold 9px Courier New';
      ctx.fillStyle = 'rgba(255,230,50,0.7)';
      ctx.fillText('a', aex + 5, aey - 5);
    }
  }
}

// --- Stars background ---
const stars = Array.from({ length: 300 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.2 + 0.2,
  a: Math.random() * 0.5 + 0.1,
}));

function drawStars() {
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  }
}

// --- Main loop ---
const speedSlider = document.getElementById('speed');
const gravitySlider = document.getElementById('gravity');
const energyDiv = document.getElementById('energy');
const speedVal = document.getElementById('speedVal');
const gravityVal = document.getElementById('gravityVal');

let frameCount = 0;
let speedMult = 25;
const trailLen = 300;

// Immediate slider reactions
speedSlider.addEventListener('input', () => {
  speedMult = parseFloat(speedSlider.value);
  speedVal.textContent = speedMult.toFixed(1) + 'x';
});

gravitySlider.addEventListener('input', () => {
  G_MULT = parseFloat(gravitySlider.value);
  gravityVal.textContent = G_MULT.toFixed(1);
});

let allOffScreenSince = 0;

function allBodiesOffScreen() {
  const margin = 50;
  for (const b of bodies) {
    const sx = b.x + W / 2;
    const sy = b.y + H / 2;
    if (sx >= -margin && sx <= W + margin && sy >= -margin && sy <= H + margin) return false;
  }
  return true;
}

function animate() {
  requestAnimationFrame(animate);

  // Background — clear fully, then draw stars fresh each frame
  ctx.fillStyle = '#000005';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  if (!paused && dragging === -1) {
    const substeps = Math.ceil(speedMult * 8);
    const dt = DT_BASE * speedMult / substeps;
    for (let s = 0; s < substeps; s++) {
      step(dt);
    }
    for (let i = 0; i < bodies.length; i++) {
      trails[i].push({ x: bodies[i].x, y: bodies[i].y });
      if (trails[i].length > 2000) trails[i].splice(0, trails[i].length - 2000);
    }

    // Auto-reset if all bodies off screen for 2 seconds
    const now = performance.now();
    if (allBodiesOffScreen()) {
      if (allOffScreenSince === 0) allOffScreenSince = now;
      else if (now - allOffScreenSince > 2000) {
        restoreInitialState();
        allOffScreenSince = 0;
      }
    } else {
      allOffScreenSince = 0;
    }
  }

  // Draw
  drawGravityLines();
  for (let i = 0; i < bodies.length; i++) drawTrail(trails[i], COLORS[i], trailLen);
  for (let i = 0; i < bodies.length; i++) drawBody(bodies[i], i);
  drawForceVectors();

  // Mass labels next to each body
  for (let i = 0; i < bodies.length; i++) {
    const bx = bodies[i].x + W / 2;
    const by = bodies[i].y + H / 2;
    const radius = 4 + bodies[i].m * 4;
    ctx.font = '10px Courier New';
    ctx.fillStyle = GLOW_COLORS[i];
    ctx.fillText(`m=${bodies[i].m.toFixed(1)}`, bx + radius + 6, by - radius - 4);
  }

  // Energy readout
  if (frameCount % 30 === 0) {
    const e = totalEnergy();
    energyDiv.innerHTML =
      `E = ${e.total.toFixed(1)}<br>` +
      `KE = ${e.KE.toFixed(1)}<br>` +
      `PE = ${e.PE.toFixed(1)}<br>` +
      `<br>${currentLabel}`;
  }

  frameCount++;
}

animate();

// --- Controls ---
document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Play' : 'Pause';
});

document.getElementById('btnRandomize').addEventListener('click', () => {
  randomize();
  ctx.clearRect(0, 0, W, H);
});

// --- Drag interaction ---
canvas.addEventListener('mousedown', (e) => {
  const mx = e.clientX - W / 2;
  const my = e.clientY - H / 2;
  for (let i = 0; i < bodies.length; i++) {
    const dx = bodies[i].x - mx;
    const dy = bodies[i].y - my;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      dragging = i;
      break;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (dragging >= 0) {
    bodies[dragging].x = e.clientX - W / 2;
    bodies[dragging].y = e.clientY - H / 2;
    bodies[dragging].vx = 0;
    bodies[dragging].vy = 0;
    trails[dragging] = [];
  }
});

canvas.addEventListener('mouseup', () => { dragging = -1; });
canvas.addEventListener('mouseleave', () => { dragging = -1; });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPause').click(); }
  if (e.code === 'KeyR') document.getElementById('btnRandomize').click();
});
</script>
</body>
</html>
