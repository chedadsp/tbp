<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-Body Problem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #aaa;
  }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    min-width: 220px;
  }
  #controls h1 {
    font-size: 14px;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .ctrl-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .ctrl-row label { color: #888; }
  .ctrl-row input[type=range] {
    width: 90px;
    accent-color: #6af;
  }
  .ctrl-row .val {
    color: #6af;
    min-width: 36px;
    text-align: right;
    font-size: 11px;
  }
  .ctrl-row input[type=checkbox] {
    accent-color: #6af;
    margin-right: 4px;
  }
  button {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
    margin-top: 6px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
  }
  #energy {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
    text-align: right;
  }
  #label-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .world-label {
    position: absolute;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    white-space: nowrap;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<div id="controls">
  <h1>Three-Body Problem</h1>
  <div class="ctrl-row">
    <label>Speed</label>
    <input type="range" id="speed" min="0.1" max="50" step="0.1" value="25">
    <span class="val" id="speedVal">25.0x</span>
  </div>
  <div class="ctrl-row">
    <label>Gravity</label>
    <input type="range" id="gravity" min="0.1" max="10" step="0.1" value="1.0">
    <span class="val" id="gravityVal">1.0</span>
  </div>
  <div class="ctrl-row">
    <label>Follow CoM</label>
    <input type="checkbox" id="followCoM">
  </div>
  <div>
    <button id="btnRandomize">Randomize</button>
    <button id="btnPause">Pause</button>
    <button id="btnResetCam">Reset Camera</button>
  </div>
</div>

<div id="info">Drag body to reposition &middot; Left-drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan</div>
<div id="energy"></div>
<div id="label-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Configuration ---
const COLORS = [
  { r: 100, g: 180, b: 255 },
  { r: 255, g: 120, b: 80 },
  { r: 120, g: 255, b: 160 },
];
const GLOW_COLORS = ['#6ab4ff', '#ff7850', '#78ffa0'];
const THREE_COLORS = [new THREE.Color(0x6ab4ff), new THREE.Color(0xff7850), new THREE.Color(0x78ffa0)];
const SOFTENING = 8;
const DT_BASE = 0.05;

let bodies = [];
let trails = [[], [], []];
let paused = false;
let dragging = -1;
let G_MULT = 1;
let currentLabel = '';
let initialState = null;

// --- Three.js Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
camera.position.set(0, 400, 800);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 100;
controls.maxDistance = 5000;
controls.enablePan = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Ambient light ---
scene.add(new THREE.AmbientLight(0x111111));

// --- Glow texture generation ---
function createGlowTexture(color, size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, `rgba(${color.r},${color.g},${color.b},0.5)`);
  gradient.addColorStop(0.2, `rgba(${color.r},${color.g},${color.b},0.25)`);
  gradient.addColorStop(0.5, `rgba(${color.r},${color.g},${color.b},0.06)`);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const glowTextures = COLORS.map(c => createGlowTexture(c));

// --- Stars ---
function createStarfield() {
  const count = 500;
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 2000 + Math.random() * 1500;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    sizes[i] = Math.random() * 2 + 0.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 2,
    sizeAttenuation: false,
    transparent: true,
    opacity: 0.5,
  });
  scene.add(new THREE.Points(geo, mat));
}
createStarfield();

// --- Body meshes ---
const bodyGroups = [];
const bodyMeshes = [];
const glowSprites = [];
const bodyLights = [];

for (let i = 0; i < 3; i++) {
  const group = new THREE.Group();

  // Core sphere
  const geo = new THREE.SphereGeometry(1, 24, 24);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);
  bodyMeshes.push(mesh);

  // Glow sprite
  const spriteMat = new THREE.SpriteMaterial({
    map: glowTextures[i],
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(spriteMat);
  group.add(sprite);
  glowSprites.push(sprite);

  // Point light
  const light = new THREE.PointLight(THREE_COLORS[i], 0.4, 400);
  group.add(light);
  bodyLights.push(light);

  scene.add(group);
  bodyGroups.push(group);
}

// --- Trail geometries ---
const MAX_TRAIL = 2000;
const TRAIL_DISPLAY = 300;
const trailLines = [];
const trailGeos = [];

for (let i = 0; i < 3; i++) {
  const positions = new Float32Array(MAX_TRAIL * 3);
  const colors = new Float32Array(MAX_TRAIL * 4);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
  geo.setDrawRange(0, 0);

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  trailLines.push(line);
  trailGeos.push(geo);
}

// --- Gravity lines ---
const gravityLines = [];
for (let p = 0; p < 3; p++) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(6);
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  gravityLines.push({ line, geo, mat });
}

// --- Force / velocity / acceleration arrows ---
const arrows = [];
// Per body: velocity (white), force from body j (2 arrows colored by j), net accel (yellow)
const ARROW_COLORS = {
  velocity: new THREE.Color(0xffffff),
  accel: new THREE.Color(0xffe632),
};

for (let i = 0; i < 3; i++) {
  // Velocity arrow
  const vArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xffffff, 6, 3);
  vArrow.visible = false;
  scene.add(vArrow);

  // Force arrows (from other 2 bodies)
  const fArrows = [];
  for (let j = 0; j < 3; j++) {
    if (j === i) { fArrows.push(null); continue; }
    const color = THREE_COLORS[j];
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, color, 6, 3);
    arrow.visible = false;
    scene.add(arrow);
    fArrows.push(arrow);
  }

  // Net acceleration arrow
  const aArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xffe632, 8, 4);
  aArrow.visible = false;
  scene.add(aArrow);

  arrows.push({ v: vArrow, f: fArrows, a: aArrow });
}

// --- Reference grid (subtle) ---
const gridHelper = new THREE.GridHelper(600, 20, 0x111122, 0x111122);
gridHelper.position.y = -150;
scene.add(gridHelper);

// --- HTML overlay labels ---
const labelContainer = document.getElementById('label-container');
const massLabels = [];
const forceLabels = [];
const vecLabels = [];

for (let i = 0; i < 3; i++) {
  const el = document.createElement('div');
  el.className = 'world-label';
  el.style.color = GLOW_COLORS[i];
  labelContainer.appendChild(el);
  massLabels.push(el);
}
// velocity labels
for (let i = 0; i < 3; i++) {
  const el = document.createElement('div');
  el.className = 'world-label';
  el.style.color = 'rgba(255,255,255,0.4)';
  labelContainer.appendChild(el);
  vecLabels.push(el);
}
// net accel labels
for (let i = 0; i < 3; i++) {
  const el = document.createElement('div');
  el.className = 'world-label';
  el.style.color = 'rgba(255,230,50,0.7)';
  el.style.fontWeight = 'bold';
  labelContainer.appendChild(el);
  vecLabels.push(el);
}
// force labels: 2 per body = 6
for (let i = 0; i < 3; i++) {
  for (let j = 0; j < 3; j++) {
    if (j === i) continue;
    const el = document.createElement('div');
    el.className = 'world-label';
    el.style.color = `rgba(${COLORS[j].r},${COLORS[j].g},${COLORS[j].b},0.6)`;
    labelContainer.appendChild(el);
    forceLabels.push(el);
  }
}

function worldToScreen(pos) {
  const vec = pos.clone().project(camera);
  if (vec.z > 1) return null;
  return {
    x: (vec.x * 0.5 + 0.5) * window.innerWidth,
    y: (-vec.y * 0.5 + 0.5) * window.innerHeight,
  };
}

// --- State management ---
function saveInitialState() {
  initialState = bodies.map(b => ({ x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz, m: b.m }));
}

function restoreInitialState() {
  if (!initialState) return;
  bodies = initialState.map(b => ({ ...b }));
  trails = [[], [], []];
}

// --- Physics ---
function computeAccelerations(bods) {
  const G = 800 * G_MULT;
  const acc = bods.map(() => ({ ax: 0, ay: 0, az: 0 }));
  for (let i = 0; i < bods.length; i++) {
    for (let j = i + 1; j < bods.length; j++) {
      const dx = bods[j].x - bods[i].x;
      const dy = bods[j].y - bods[i].y;
      const dz = bods[j].z - bods[i].z;
      const distSq = dx * dx + dy * dy + dz * dz + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const F = G / (distSq * dist);
      acc[i].ax += F * dx * bods[j].m;
      acc[i].ay += F * dy * bods[j].m;
      acc[i].az += F * dz * bods[j].m;
      acc[j].ax -= F * dx * bods[i].m;
      acc[j].ay -= F * dy * bods[i].m;
      acc[j].az -= F * dz * bods[i].m;
    }
  }
  return acc;
}

function step(dt) {
  const acc = computeAccelerations(bodies);
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc[i].ax * dt * 0.5;
    bodies[i].vy += acc[i].ay * dt * 0.5;
    bodies[i].vz += acc[i].az * dt * 0.5;
    bodies[i].x += bodies[i].vx * dt;
    bodies[i].y += bodies[i].vy * dt;
    bodies[i].z += bodies[i].vz * dt;
  }
  const acc2 = computeAccelerations(bodies);
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vx += acc2[i].ax * dt * 0.5;
    bodies[i].vy += acc2[i].ay * dt * 0.5;
    bodies[i].vz += acc2[i].az * dt * 0.5;
  }
}

function totalEnergy() {
  const G = 800 * G_MULT;
  let KE = 0, PE = 0;
  for (let i = 0; i < bodies.length; i++) {
    KE += 0.5 * bodies[i].m * (bodies[i].vx ** 2 + bodies[i].vy ** 2 + bodies[i].vz ** 2);
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dz = bodies[j].z - bodies[i].z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz + SOFTENING * SOFTENING);
      PE -= G * bodies[i].m * bodies[j].m / dist;
    }
  }
  return { KE, PE, total: KE + PE };
}

// --- Randomize ---
function randomize() {
  const G = 800;
  const spread = 200;
  const zSpread = 120;
  const masses = [
    0.5 + Math.random() * 2.5,
    0.5 + Math.random() * 2.5,
    0.5 + Math.random() * 2.5,
  ];
  const mTotal = masses[0] + masses[1] + masses[2];

  bodies = [];
  for (let i = 0; i < 3; i++) {
    let x, y, z, tooClose;
    do {
      x = (Math.random() - 0.5) * spread * 2;
      y = (Math.random() - 0.5) * spread * 2;
      z = (Math.random() - 0.5) * zSpread * 2;
      tooClose = false;
      for (let k = 0; k < bodies.length; k++) {
        const d = Math.sqrt((x - bodies[k].x) ** 2 + (y - bodies[k].y) ** 2 + (z - bodies[k].z) ** 2);
        if (d < 60) { tooClose = true; break; }
      }
    } while (tooClose);
    bodies.push({ x, y, z, vx: 0, vy: 0, vz: 0, m: masses[i] });
  }

  // Center of mass at origin
  let cmx = 0, cmy = 0, cmz = 0;
  for (const b of bodies) { cmx += b.x * b.m; cmy += b.y * b.m; cmz += b.z * b.m; }
  for (const b of bodies) { b.x -= cmx / mTotal; b.y -= cmy / mTotal; b.z -= cmz / mTotal; }

  // 3D orbital velocities using cross product for tangential direction
  for (let i = 0; i < 3; i++) {
    const r = Math.sqrt(bodies[i].x ** 2 + bodies[i].y ** 2 + bodies[i].z ** 2) || 1;
    const otherMass = mTotal - bodies[i].m;
    const vOrbit = Math.sqrt(G * otherMass / r);

    // Position unit vector
    const px = bodies[i].x / r, py = bodies[i].y / r, pz = bodies[i].z / r;

    // Random axis for cross product (avoid parallel to position)
    let ax = Math.random() - 0.5, ay = Math.random() - 0.5, az = Math.random() - 0.5;
    const alen = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
    ax /= alen; ay /= alen; az /= alen;

    // Cross product: tangent = position × randomAxis
    let tx = py * az - pz * ay;
    let ty = pz * ax - px * az;
    let tz = px * ay - py * ax;
    let tlen = Math.sqrt(tx * tx + ty * ty + tz * tz);

    // If nearly parallel, use a different axis
    if (tlen < 0.1) {
      ax = 0; ay = 1; az = 0;
      tx = py * az - pz * ay;
      ty = pz * ax - px * az;
      tz = px * ay - py * ax;
      tlen = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
    }
    tx /= tlen; ty /= tlen; tz /= tlen;

    const speed = vOrbit * (0.4 + Math.random() * 0.6);
    const sign = Math.random() < 0.5 ? -1 : 1;
    const perturb = vOrbit * 0.3;
    bodies[i].vx = sign * tx * speed + (Math.random() - 0.5) * perturb;
    bodies[i].vy = sign * ty * speed + (Math.random() - 0.5) * perturb;
    bodies[i].vz = sign * tz * speed + (Math.random() - 0.5) * perturb;
  }

  // Ensure non-zero velocity
  for (const b of bodies) {
    const v = Math.sqrt(b.vx ** 2 + b.vy ** 2 + b.vz ** 2);
    if (v < 1) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      b.vx = Math.sin(phi) * Math.cos(theta) * 5;
      b.vy = Math.sin(phi) * Math.sin(theta) * 5;
      b.vz = Math.cos(phi) * 5;
    }
  }

  // Zero net momentum
  let px2 = 0, py2 = 0, pz2 = 0;
  for (const b of bodies) { px2 += b.vx * b.m; py2 += b.vy * b.m; pz2 += b.vz * b.m; }
  for (const b of bodies) { b.vx -= px2 / mTotal; b.vy -= py2 / mTotal; b.vz -= pz2 / mTotal; }

  trails = [[], [], []];
  currentLabel = `m: ${masses.map(m => m.toFixed(1)).join(', ')}`;
  saveInitialState();
  updateBodyMeshes();
}

function updateBodyMeshes() {
  for (let i = 0; i < 3; i++) {
    const radius = 4 + bodies[i].m * 4;
    bodyMeshes[i].scale.setScalar(radius);
    glowSprites[i].scale.setScalar(radius * 16);
  }
}

randomize();

// --- Auto-reset check ---
let allFarSince = 0;
function allBodiesFar() {
  for (const b of bodies) {
    const d = Math.sqrt(b.x * b.x + b.y * b.y + b.z * b.z);
    if (d < 2000) return false;
  }
  return true;
}

// --- Update rendering ---
function updateTrails() {
  for (let i = 0; i < 3; i++) {
    const trail = trails[i];
    const geo = trailGeos[i];
    const posAttr = geo.attributes.position;
    const colAttr = geo.attributes.color;
    const start = Math.max(0, trail.length - TRAIL_DISPLAY);
    const count = trail.length - start;

    for (let k = 0; k < count; k++) {
      const t = trail[start + k];
      posAttr.array[k * 3] = t.x;
      posAttr.array[k * 3 + 1] = t.y;
      posAttr.array[k * 3 + 2] = t.z;
      const alpha = (k + 1) / count;
      colAttr.array[k * 4] = COLORS[i].r / 255;
      colAttr.array[k * 4 + 1] = COLORS[i].g / 255;
      colAttr.array[k * 4 + 2] = COLORS[i].b / 255;
      colAttr.array[k * 4 + 3] = alpha * 0.7;
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    geo.setDrawRange(0, count);
  }
}

function updateGravityLines() {
  let idx = 0;
  for (let i = 0; i < 3; i++) {
    for (let j = i + 1; j < 3; j++) {
      const gl = gravityLines[idx];
      const posArr = gl.geo.attributes.position.array;
      posArr[0] = bodies[i].x; posArr[1] = bodies[i].y; posArr[2] = bodies[i].z;
      posArr[3] = bodies[j].x; posArr[4] = bodies[j].y; posArr[5] = bodies[j].z;
      gl.geo.attributes.position.needsUpdate = true;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dz = bodies[j].z - bodies[i].z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      gl.mat.opacity = Math.max(0.02, Math.min(0.12, 200 / dist));
      idx++;
    }
  }
}

const _tempVec = new THREE.Vector3();
const V_SCALE = 0.6;
const F_SCALE = 0.08;
const A_SCALE = 12;
const MAX_LEN = 140;

function updateForceVectors() {
  const G = 800 * G_MULT;

  for (let i = 0; i < 3; i++) {
    const origin = new THREE.Vector3(bodies[i].x, bodies[i].y, bodies[i].z);
    const b = bodies[i];

    // Velocity arrow
    const vMag = Math.sqrt(b.vx ** 2 + b.vy ** 2 + b.vz ** 2);
    const vLen = Math.min(vMag * V_SCALE, MAX_LEN);
    if (vLen > 2) {
      _tempVec.set(b.vx, b.vy, b.vz).normalize();
      arrows[i].v.position.copy(origin);
      arrows[i].v.setDirection(_tempVec);
      arrows[i].v.setLength(vLen, 6, 3);
      arrows[i].v.visible = true;
    } else {
      arrows[i].v.visible = false;
    }

    // Force arrows and net acceleration
    let netAx = 0, netAy = 0, netAz = 0;

    for (let j = 0; j < 3; j++) {
      if (j === i) continue;
      const dx = bodies[j].x - b.x;
      const dy = bodies[j].y - b.y;
      const dz = bodies[j].z - b.z;
      const distSq = dx * dx + dy * dy + dz * dz + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const ux = dx / dist, uy = dy / dist, uz = dz / dist;

      const Fmag = G * b.m * bodies[j].m / distSq;
      const ax = G * bodies[j].m / distSq * ux;
      const ay = G * bodies[j].m / distSq * uy;
      const az = G * bodies[j].m / distSq * uz;
      netAx += ax; netAy += ay; netAz += az;

      const fLen = Math.min(Fmag * F_SCALE, MAX_LEN);
      const fArrow = arrows[i].f[j];
      if (fLen > 2) {
        _tempVec.set(ux, uy, uz);
        fArrow.position.copy(origin);
        fArrow.setDirection(_tempVec);
        fArrow.setLength(fLen, 6, 3);
        fArrow.visible = true;
      } else {
        fArrow.visible = false;
      }
    }

    // Net acceleration
    const aMag = Math.sqrt(netAx ** 2 + netAy ** 2 + netAz ** 2);
    const aLen = Math.min(aMag * A_SCALE, MAX_LEN);
    if (aLen > 3) {
      _tempVec.set(netAx, netAy, netAz).normalize();
      arrows[i].a.position.copy(origin);
      arrows[i].a.setDirection(_tempVec);
      arrows[i].a.setLength(aLen, 8, 4);
      arrows[i].a.visible = true;
    } else {
      arrows[i].a.visible = false;
    }
  }
}

function updateLabels() {
  const G = 800 * G_MULT;
  for (let i = 0; i < 3; i++) {
    const pos = new THREE.Vector3(bodies[i].x, bodies[i].y, bodies[i].z);
    const radius = 4 + bodies[i].m * 4;

    // Mass label
    const offset = pos.clone();
    offset.x += radius + 10;
    offset.y += radius + 10;
    const screen = worldToScreen(offset);
    if (screen) {
      massLabels[i].style.display = '';
      massLabels[i].style.left = screen.x + 'px';
      massLabels[i].style.top = screen.y + 'px';
      massLabels[i].textContent = `m=${bodies[i].m.toFixed(1)}`;
    } else {
      massLabels[i].style.display = 'none';
    }

    // Velocity label
    const vMag = Math.sqrt(bodies[i].vx ** 2 + bodies[i].vy ** 2 + bodies[i].vz ** 2);
    const vLen = Math.min(vMag * V_SCALE, MAX_LEN);
    const vLabel = vecLabels[i];
    if (vLen > 2) {
      const vEnd = pos.clone().add(new THREE.Vector3(bodies[i].vx, bodies[i].vy, bodies[i].vz).normalize().multiplyScalar(vLen));
      const vs = worldToScreen(vEnd);
      if (vs) {
        vLabel.style.display = '';
        vLabel.style.left = (vs.x + 8) + 'px';
        vLabel.style.top = (vs.y - 8) + 'px';
        vLabel.textContent = 'v';
      } else { vLabel.style.display = 'none'; }
    } else { vLabel.style.display = 'none'; }

    // Net accel label
    let netAx = 0, netAy = 0, netAz = 0;
    for (let j = 0; j < 3; j++) {
      if (j === i) continue;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dz = bodies[j].z - bodies[i].z;
      const distSq = dx * dx + dy * dy + dz * dz + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const ux = dx / dist, uy = dy / dist, uz = dz / dist;
      netAx += G * bodies[j].m / distSq * ux;
      netAy += G * bodies[j].m / distSq * uy;
      netAz += G * bodies[j].m / distSq * uz;
    }
    const aMag = Math.sqrt(netAx ** 2 + netAy ** 2 + netAz ** 2);
    const aLen = Math.min(aMag * A_SCALE, MAX_LEN);
    const aLabel = vecLabels[i + 3];
    if (aLen > 3) {
      const aEnd = pos.clone().add(new THREE.Vector3(netAx, netAy, netAz).normalize().multiplyScalar(aLen));
      const as = worldToScreen(aEnd);
      if (as) {
        aLabel.style.display = '';
        aLabel.style.left = (as.x + 8) + 'px';
        aLabel.style.top = (as.y - 8) + 'px';
        aLabel.textContent = 'a';
      } else { aLabel.style.display = 'none'; }
    } else { aLabel.style.display = 'none'; }
  }

  // Force labels
  let fIdx = 0;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      if (j === i) continue;
      const dx = bodies[j].x - bodies[i].x;
      const dy = bodies[j].y - bodies[i].y;
      const dz = bodies[j].z - bodies[i].z;
      const distSq = dx * dx + dy * dy + dz * dz + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const Fmag = G * bodies[i].m * bodies[j].m / distSq;
      const fLen = Math.min(Fmag * F_SCALE, MAX_LEN);
      const fl = forceLabels[fIdx];
      if (fLen > 2) {
        const ux = dx / dist, uy = dy / dist, uz = dz / dist;
        const mid = new THREE.Vector3(
          bodies[i].x + ux * fLen * 0.55,
          bodies[i].y + uy * fLen * 0.55 + 12,
          bodies[i].z + uz * fLen * 0.55,
        );
        const fs = worldToScreen(mid);
        if (fs) {
          fl.style.display = '';
          fl.style.left = fs.x + 'px';
          fl.style.top = fs.y + 'px';
          fl.textContent = `F=${Fmag.toFixed(1)}`;
        } else { fl.style.display = 'none'; }
      } else { fl.style.display = 'none'; }
      fIdx++;
    }
  }
}

// --- Controls ---
const speedSlider = document.getElementById('speed');
const gravitySlider = document.getElementById('gravity');
const energyDiv = document.getElementById('energy');
const speedVal = document.getElementById('speedVal');
const gravityVal = document.getElementById('gravityVal');
const followCoM = document.getElementById('followCoM');

let frameCount = 0;
let speedMult = 25;

speedSlider.addEventListener('input', () => {
  speedMult = parseFloat(speedSlider.value);
  speedVal.textContent = speedMult.toFixed(1) + 'x';
});

gravitySlider.addEventListener('input', () => {
  G_MULT = parseFloat(gravitySlider.value);
  gravityVal.textContent = G_MULT.toFixed(1);
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Play' : 'Pause';
});

document.getElementById('btnRandomize').addEventListener('click', () => {
  randomize();
});

document.getElementById('btnResetCam').addEventListener('click', () => {
  camera.position.set(0, 400, 800);
  controls.target.set(0, 0, 0);
  controls.update();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPause').click(); }
  if (e.code === 'KeyR') document.getElementById('btnRandomize').click();
});

// --- Drag interaction ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const intersection = new THREE.Vector3();

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Test against enlarged spheres for easier picking
  let closestDist = Infinity;
  let closestIdx = -1;
  for (let i = 0; i < 3; i++) {
    const bodyPos = new THREE.Vector3(bodies[i].x, bodies[i].y, bodies[i].z);
    const sphere = new THREE.Sphere(bodyPos, 30);
    const ray = raycaster.ray;
    const target = new THREE.Vector3();
    if (ray.intersectSphere(sphere, target)) {
      const d = target.distanceTo(camera.position);
      if (d < closestDist) {
        closestDist = d;
        closestIdx = i;
      }
    }
  }

  if (closestIdx >= 0) {
    dragging = closestIdx;
    controls.enabled = false;
    const bodyPos = new THREE.Vector3(bodies[closestIdx].x, bodies[closestIdx].y, bodies[closestIdx].z);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir, bodyPos);
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging < 0) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(dragPlane, intersection);
  if (intersection) {
    bodies[dragging].x = intersection.x;
    bodies[dragging].y = intersection.y;
    bodies[dragging].z = intersection.z;
    bodies[dragging].vx = 0;
    bodies[dragging].vy = 0;
    bodies[dragging].vz = 0;
    trails[dragging] = [];
  }
});

renderer.domElement.addEventListener('pointerup', () => {
  if (dragging >= 0) {
    dragging = -1;
    controls.enabled = true;
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  if (dragging >= 0) {
    dragging = -1;
    controls.enabled = true;
  }
});

// --- Main loop ---
function animate() {
  requestAnimationFrame(animate);

  if (!paused && dragging === -1) {
    const substeps = Math.ceil(speedMult * 8);
    const dt = DT_BASE * speedMult / substeps;
    for (let s = 0; s < substeps; s++) {
      step(dt);
    }
    for (let i = 0; i < bodies.length; i++) {
      trails[i].push({ x: bodies[i].x, y: bodies[i].y, z: bodies[i].z });
      if (trails[i].length > MAX_TRAIL) trails[i].splice(0, trails[i].length - MAX_TRAIL);
    }

    // Auto-reset if all bodies far for 2 seconds
    const now = performance.now();
    if (allBodiesFar()) {
      if (allFarSince === 0) allFarSince = now;
      else if (now - allFarSince > 2000) {
        restoreInitialState();
        updateBodyMeshes();
        allFarSince = 0;
      }
    } else {
      allFarSince = 0;
    }
  }

  // Update body positions
  for (let i = 0; i < 3; i++) {
    bodyGroups[i].position.set(bodies[i].x, bodies[i].y, bodies[i].z);
  }

  // Follow center of mass
  if (followCoM.checked) {
    let cmx = 0, cmy = 0, cmz = 0, mt = 0;
    for (const b of bodies) { cmx += b.x * b.m; cmy += b.y * b.m; cmz += b.z * b.m; mt += b.m; }
    controls.target.set(cmx / mt, cmy / mt, cmz / mt);
  }

  updateTrails();
  updateGravityLines();
  updateForceVectors();
  updateLabels();

  controls.update();
  renderer.render(scene, camera);

  // Energy readout
  if (frameCount % 30 === 0) {
    const e = totalEnergy();
    energyDiv.innerHTML =
      `E = ${e.total.toFixed(1)}<br>` +
      `KE = ${e.KE.toFixed(1)}<br>` +
      `PE = ${e.PE.toFixed(1)}<br>` +
      `<br>${currentLabel}`;
  }

  frameCount++;
}

animate();
</script>
